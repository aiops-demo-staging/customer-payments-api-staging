organization: Digital Channels
description: Customer-facing entry point for paying invoices; submits invoice payments to Billing.
computeClassification:
  dataType: [None]
links:
  healthcheck:
    uri: /health
  source:
    url: https://github.com/highvelocity-rca-demo/customer-payments-api
compose:
  microservice:
    image: ghcr.io/highvelocity-rca-demo/customer-payments-api
    tag: ${DOCKER_TAG}
    ports: [8080:3000]
buildNumber: ${DOCKER_TAG}
config:
  environmentVariables:
    NODE_ENV: production
    SERVICE_NAME: customer-payments-api
