organization: Digital Channels
description: Customer-facing entry point for paying invoices; submits invoice payments to Billing.
computeClassification:
  dataType: [None]
links:
  healthcheck:
    uri: /health
  source:
    url: https://github.com/Team-Demo-12/customer-payments-api
compose:
  microservice:
    image: ghcr.io/Team-Demo-12/customer-payments-api
    tag: ${DOCKER_TAG}
    ports: [8080:8080]
buildNumber: ${DOCKER_TAG}
config:
  environmentVariables:
    SERVICE_NAME: customer-payments-api
