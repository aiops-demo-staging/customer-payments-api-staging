services:
  customer-payments-api:
    build: { context: ., dockerfile: Dockerfile }
    image: beaconstone/customer-payments-api:local
    container_name: customer-payments-api
    restart: unless-stopped
    ports: ["${HOST_PORT:-3000}:3000"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      SERVICE_NAME: ${SERVICE_NAME:-customer-payments-api}
      API_KEY: ${API_KEY:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    profiles: [proxy]
    image: nginx:1.25-alpine
    container_name: customer-payments-api-proxy
    restart: unless-stopped
    depends_on:
      customer-payments-api: { condition: service_healthy }
    ports: ["${PROXY_PORT:-8080}:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
